<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSAFIR CAFE | Ek Cup Yaadon Ka</title>
    
    <!-- Retro Indian Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Yatra+One&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for 90s Palette */
        :root {
            --vintage-red: #8B0000;
            --amber-glow: #ffbf00;
            --chai-brown: #5d4037;
            --paper-cream: #f4eCD8;
            --black-shadow: rgba(10, 5, 2, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Kalam', cursive;
        }

        /* 16:9 Cinematic Container */
        .cinematic-frame {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background-color: #111;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .cafe-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url(' cafe-bg.jpg.jpeg'); 
            background-size: cover;
            background-position: center;
            filter: sepia(0.4) contrast(1.1) brightness(0.8) saturate(1.2);
            z-index: 1;
        }

        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.15"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: overlay;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(15,8,0,0.8) 100%);
            pointer-events: none;
            z-index: 9;
        }

        .signboard-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
            text-shadow: 3px 4px 10px rgba(0,0,0,0.9);
        }

        .main-title {
            font-family: 'Yatra One', serif;
            font-size: 5vw;
            color: var(--amber-glow);
            letter-spacing: 2px;
            margin-bottom: -10px;
            text-shadow: 
                2px 2px 0px var(--vintage-red),
                4px 4px 0px rgba(0,0,0,0.8),
                0 0 20px rgba(255, 191, 0, 0.4);
            animation: flicker 4s infinite alternate;
        }

        .subtitle {
            font-family: 'Kalam', cursive;
            font-size: 2vw;
            color: var(--paper-cream);
            opacity: 0.9;
        }

        /* Modified Hotspot Badges Styling */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hotspot-icon {
            position: relative;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle at 35% 30%, #4a2e1b, #120904 85%);
            border: 2px solid var(--amber-glow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 0 0 3px rgba(139, 0, 0, 0.7),
                0 0 15px rgba(255, 191, 0, 0.4),
                inset 0 0 10px rgba(0,0,0,0.8),
                0 8px 20px rgba(0,0,0,0.8);
            transform: rotate(-5deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: badgeFloat 3.5s infinite ease-in-out;
        }
        /* Continuous Glowing Pulse Ring */
        .hotspot-icon::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1px dashed rgba(255, 191, 0, 0.6);
            border-radius: 50%;
            animation: ringRotate 12s linear infinite;
        }
        .hotspot-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 191, 0, 0.5);
            opacity: 0.6;
            animation: pulseGlow 2s infinite alternate;
        }
        .menu-hotspot .hotspot-icon { animation-delay: 0s; transform: rotate(-6deg); }
        .radio-hotspot .hotspot-icon { animation-delay: 0.8s; transform: rotate(6deg); }
        .chai-hotspot .hotspot-icon { animation-delay: 1.6s; transform: rotate(-3deg); }
        .hotspot:hover .hotspot-icon {
            transform: rotate(0deg) scale(1.25);
            border-color: #fff;
            box-shadow: 
                0 0 0 4px var(--vintage-red),
                0 0 25px rgba(255, 191, 0, 0.9),
                inset 0 0 15px rgba(255, 191, 0, 0.3),
                0 12px 25px rgba(0,0,0,0.9);
            animation-play-state: paused;
        }
        .hotspot:hover .hotspot-icon svg {
            filter: drop-shadow(0 0 6px var(--amber-glow));
            transform: scale(1.1);
        }
        .hotspot-icon svg {
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        /* Floating Badge Tag */
        .badge-tag {
            position: absolute;
            top: 105%;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background: linear-gradient(135deg, #a80000, #5c0000);
            color: var(--paper-cream);
            font-family: 'Special Elite', monospace;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            padding: 3px 10px;
            border-radius: 3px;
            border: 1px solid var(--amber-glow);
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .hotspot:hover .badge-tag {
            background: var(--amber-glow);
            color: #000;
            border-color: #fff;
            transform: translateX(-50%) scale(1.1);
        }
        /* Keyframe Animations */
        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-8deg) rotate(2deg); }
        }
        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        .menu-hotspot { top: 50%; left: 20%; width: 10%; height: 25%; }
        .radio-hotspot { top: 65%; left: 70%; width: 12%; height: 15%; }
        .chai-hotspot { top: 75%; left: 45%; width: 8%; height: 12%; }

        .menu-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .menu-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .menu-paper {
            width: 90%;
            max-width: 400px;
            background: var(--paper-cream);
            padding: 40px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            transform: scale(0.9) rotate(-2deg);
            transition: transform 0.4s ease;
            position: relative;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
        }

        .menu-modal.active .menu-paper {
            transform: scale(1) rotate(1deg);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Special Elite', monospace;
            font-size: 24px;
            color: var(--vintage-red);
            cursor: pointer;
            font-weight: bold;
        }

        .menu-title {
            font-family: 'Yatra One', serif;
            text-align: center;
            color: var(--vintage-red);
            font-size: 28px;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--chai-brown);
            padding-bottom: 10px;
        }

        .menu-items {
            list-style: none;
            font-family: 'Kalam', cursive;
            font-size: 22px;
            color: var(--chai-brown);
            line-height: 1.8;
        }

        .menu-items li {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(93, 64, 55, 0.2);
            padding: 5px 0;
        }

        .steam {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; text-shadow: 2px 2px 0px var(--vintage-red), 4px 4px 0px rgba(0,0,0,0.8), 0 0 10px rgba(255, 191, 0, 0.2); }
            52% { opacity: 0.4; }
            54% { opacity: 1; }
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-50px) scale(3); opacity: 0; }
        }

        .music-waves {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            color: var(--amber-glow);
            font-family: 'Special Elite', monospace;
            font-size: 12px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="cinematic-frame">
        <div class="cafe-bg"></div>
        <div class="vignette"></div>
        <div class="grain-overlay"></div>

        <div class="signboard-container">
            <h1 class="main-title">Deeksha Music Cafe</h1>
            <p class="subtitle">🎞️ Have Coffee and Relax</p>
        </div>
        
        <div class="hotspot menu-hotspot" data-label="View Menu" onclick="toggleMenu()">
            <div class="hotspot-icon">
                <svg viewBox="0 0 40 40" width="26" height="26" fill="none" stroke="var(--amber-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="5" width="24" height="30" rx="1"/>
                    <line x1="13" y1="13" x2="27" y2="13"/>
                    <line x1="13" y1="19" x2="27" y2="19"/>
                    <line x1="13" y1="25" x2="22" y2="25"/>
                    <circle cx="14" cy="30" r="1.2" fill="var(--amber-glow)" stroke="none"/>
                </svg>
            </div>
            <div class="badge-tag">MENU</div>
        </div>
        
        <div class="hotspot radio-hotspot" data-label="Play 90s Radio" onclick="toggleRadio()">
            <div class="hotspot-icon">
                <svg viewBox="0 0 40 40" width="28" height="28" fill="none" stroke="var(--amber-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="14" width="28" height="18" rx="2"/>
                    <circle cx="14" cy="23" r="4"/>
                    <line x1="22" y1="19" x2="29" y2="19"/>
                    <line x1="22" y1="23" x2="29" y2="23"/>
                    <line x1="22" y1="27" x2="26" y2="27"/>
                    <path d="M12 14 L16 6" />
                    <path d="M28 14 L24 6" />
                </svg>
            </div>
            <div class="badge-tag">RADIO</div>
            <div class="music-waves" id="music-indicator">♫ Playing...</div>
        </div>
        
        <div class="hotspot chai-hotspot" data-label="Garam Chai">
            <div class="hotspot-icon">
                <svg viewBox="0 0 40 40" width="24" height="24" fill="none" stroke="var(--amber-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 16 h16 l-2 16 h-12 z"/>
                    <path d="M26 19 q6 0 6 6 q0 6 -6 6"/>
                    <path d="M14 10 q1.5 -3 0 -6" stroke-width="1.6"/>
                    <path d="M19 10 q1.5 -3 0 -6" stroke-width="1.6"/>
                    <path d="M24 10 q1.5 -3 0 -6" stroke-width="1.6"/>
                </svg>
            </div>
            <div class="badge-tag">CHAI</div>
            <div class="steam" style="animation: rise 2s infinite ease-in;"></div>
            <div class="steam" style="animation: rise 2.5s infinite ease-in 0.5s;"></div>
        </div>
    </div>

    <div class="menu-modal" id="menuModal">
        <div class="menu-paper">
            <div class="close-btn" onclick="toggleMenu()">X</div>
            <h2 class="menu-title">Chilling Menu</h2>
            <ul class="menu-items">
                <li><span>Healing Chai</span> <span>₹5</span></li>
                <li><span>Love Maska</span> <span>₹12</span></li>
                <li><span>Gussail Samosa (2pc)</span> <span>₹10</span></li>
                <li><span>Kiss Biscuit (Plate)</span> <span>₹4</span></li>
                <li><span>Teri Meri Maggie (Masala)</span> <span>₹15</span></li>
                <li><span>Gold Flake (Nahi Milegi)</span> <span>₹...</span></li>
            </ul>
        </div>
    </div>

    <!-- Audio Player with absolute path support -->
    <audio id="cafeAudio" loop preload="auto">
        <source src="music01.mp3" type="audio/mpeg">
    </audio>

    <script>
        const menuModal = document.getElementById('menuModal');
        
        function toggleMenu() {
            menuModal.classList.toggle('active');
        }

        menuModal.addEventListener('click', function(e) {
            if (e.target === menuModal) {
                toggleMenu();
            }
        });

        const audio = document.getElementById('cafeAudio');
        const indicator = document.getElementById('music-indicator');
        let isPlaying = false;

        function toggleRadio() {
            if (isPlaying) {
                audio.pause();
                indicator.style.display = 'none';
                isPlaying = false;
            } else {
                // Play promise handling to avoid browser blocking issues
                var playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        indicator.style.display = 'block';
                        isPlaying = true;
                    }).catch(error => {
                        console.log("Audio play error:", error);
                        alert("Audio play karne me dikkat ho rahi hai. Kripya check karein ki 'music01.mp3' file sahi se commit hui hai ya nahi.");
                    });
                }
            }
        }
    </script>
</body>
</html>
